<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · RMS Race Day</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/rms.css') }}" rel="stylesheet">
</head>
<body>
<main class="rms-login">
  <div class="w-100" style="max-width: 380px">
    <img src="{{ url_for('static', filename='img/rms-logo.png') }}" alt="RMS Kart &amp; Performance" class="rms-login-logo">
    <form class="rms-login-card" method="post" action="{{ url_for('login') }}">
      {{ csrf_field() }}
      <input type="hidden" name="next" value="{{ next }}">
      <h1>Team sign in</h1>
      {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
      {% if not configured %}
        <div class="alert alert-warning py-2 small">Sign-in isn't set up. Run <code>python auth.py</code> and set <code>ADMIN_PASSWORD_HASH</code>.</div>
      {% endif %}
      {# Fixed username so password managers can save the login #}
      <input type="text" name="username" value="rms" autocomplete="username" hidden>
      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-3" type="password" id="password" name="password" autocomplete="current-password" required autofocus>
      <button class="btn btn-rms w-100 py-2"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
    </form>
    <div class="rms-login-public">
      <a href="{{ url_for('schedule') }}">Schedule</a> · <a href="{{ url_for('races') }}">Race results</a>
    </div>
  </div>
</main>
</body>
</html>
